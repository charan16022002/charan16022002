name: Python CI

on:
  push:
    paths:
      - "projects/github-actions-python-ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "projects/github-actions-python-ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/github-actions-python-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run application smoke test
        run: python app.py
