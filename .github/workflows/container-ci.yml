name: Container CI

on:
  push:
    paths:
      - "projects/dockerized-python-app/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    paths:
      - "projects/dockerized-python-app/**"
      - ".github/workflows/container-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t sre-demo:ci projects/dockerized-python-app
      - name: Start container
        run: docker run -d --name sre-demo -p 8080:8080 sre-demo:ci
      - name: Smoke test endpoint
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs sre-demo
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f sre-demo || true
